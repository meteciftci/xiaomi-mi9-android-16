# Mi 9 (cepheus) ozel ROM - kararlar
# Taban: crDroid v12.13 (Android 16, 2026-10-24) + NikGapps (crdroid-official, 2026-02-23)
# Durum: KARAR = kullanici onayladi, ONERI = benim onerim, TEST = telefonda dogrulanacak

## Mimari (ONERI)
# ROM zip'i DEGISTIRILMEZ (resmi crDroid zip'i indirilir). Ozel is "ozel NikGapps" zip'indedir:
#   - nikgapps.config : sadece secilen Google paketleri acik
#   - debloater.config: crDroid uygulamalari kurulum aninda silinir (NikGapps debloat'i kurmadan once calistirir)
#   - gereksiz AppSet paketleri zip'ten cikarilir (boyut kuculur)
# Kurucu betik (Mac/Linux .sh, Windows .ps1) sirayla: recovery -> firmware -> ROM -> ozel GApps -> format -> acilis.
# Avantaj: ROM'u yeniden paketlemek yok; crDroid aylik guncellemesi ayni betikle yeni zip alir.

## crDroid uygulamalari -> KALDIR (karar)
REMOVE_CRDROID="
  Jelly            # tarayici, komple
  MatLog           # gelistirici log araci
  AxSandbox        # baska ROM'dan gelme, cok genis yetkili (67 MB)
  Etar             # -> Google Takvim
  Gallery2         # -> Google Fotograflar
  Glimpse          # -> Google Fotograflar (kullanici karari)
  Updater          # resmi crDroid guncellemesi bu ROM'un ustune yazmasin
  Twelve           # muzik calar
  Dialer           # -> Google Telefon
  messaging        # -> Google Mesajlar
  Contacts         # -> Google Kisiler
  DeskClock        # -> Google Saat
  ExactCalculator  # -> Google Hesap Makinesi
"
# EasterEgg /system/app altinda (erofs, salt okunur): silinemez, sadece devre disi birakilabilir (onemsiz, 2 MB)

## Kilit ekrani saat fontlari (karar: Claude secti)
# Kalacak 5: SansSerif (varsayilan), GoogleSansFlex, Lato, Nunito, Rubik. Diger 85 overlay kaldirilir.

## ROM'da KALANLAR (karar)
KEEP="
  MiuiCamera DocumentsUI(simge gizlenecek, TEST) GameSpace OmniJaws Recorder AndroidAuto
"

## Eklenecek Google uygulamalari
ADD_GOOGLE="
  GoogleDialer GoogleMessages GoogleContacts GoogleClock GoogleCalculator
  GoogleCalendar GooglePhotos CarrierServices
"
# TEST: bu paketlerin APK'lari 'full' NikGapps zip'inde var mi? (indiriliyor, dogrulanacak)

## GApps cekirdek (kalacak)
GAPPS_CORE="
  GmsCore GooglePlayStore GoogleServicesFramework ExtraFiles
  GoogleContactsSyncAdapter GoogleCalendarSyncAdapter
  SetupWizard GoogleRestore GoogleOneTimeInitializer DeviceSetup
  WebViewGoogle TrichromeLibrary
  AndroidAuto Velvet GoogleTTS   # Android Auto sesli komut ve navigasyon sesi icin (kullanici karari: arac kullanimi)
"

## GApps -> CIKAR
GAPPS_DROP="
  Gemini DeviceHealthServices DigitalWellbeing MarkupGoogle GoogleSounds   # karar
  DevicePersonalizationServices                                            # ONERI (113 MB), TEST: Velvet/Android Auto bozulursa geri ekle
"
# PrivateComputeServices (21 MB) ve SettingsServices (17 MB): ilk surumde birakilir, TEST ile elenir.

## Guncel durum (kurulum testlerinden sonra)
# Eklendi: GBoard (varsayilan klavye, Turkce duzen sistem diliyle gelir); stok klavye LatinIME ve AudioFX kaldirildi.
# Acilis animasyonu: ozel animasyon denendi, ekrana sigmadigi icin geri alindi (ROM'un orijinali kalir).
# Ekstra tus (Mi AI, key 689): gapps/gpio-keys.kl -> PROG_YELLOW WAKE; extrakey/ uygulamasi system_ext/priv-app olarak kurulur.
# Varsayilan ayarlar (extrakey ilk acilista): hareketle gezinme (overlay config), QS ses kaydiricisi kapali,
#   dinamik cubuk acik, pil yuzdesi simge icinde, uc parmak kaydirma = ekran goruntusu.
# Kurulum adimi: ROM'dan once eski addon.d betikleri silinir (ROM'un yedekle/geri yukle adimi kirli GApps getirmesin).
